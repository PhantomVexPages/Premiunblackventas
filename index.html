<!DOCTYPE html>

<head>

    <style>
        body {

            font-family: Arial, sans-serif;

            overflow-x: hidden;
        }

        /* Animación de código binario */
        .binary-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

        .binary-code {

        .menu-horizontal {
            background-color: #000;

            border-bottom: 2px solid #ff0000;

            align-items: center;
            position: relative;

        }

        .admin-panel {

            padding: 50px 10px;
            position: relative;
            margin-bottom: 60px;
        }

        .company-title {
            display: inline-block;
            border: 3px solid #ff0000;
            border-radius: 15px;
            padding: 15px 30px;
            background-color: rgba(0, 0, 0, 0.8);
            animation: moveTitle 3s infinite alternate;
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .company-title h1 {
            margin: 0;
            font-size: 1.8em;
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .welcome-box {
            display: inline-block;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
            box-sizing: border-box;
        }

        .welcome-box p {
            margin: 0;
            color: white;
            font-size: 1em;

        }

        .highlight {
            color: #ff0000;

        @keyframes moveTitle {
            0% {
                transform: translateX(-5px);
            }
            100% {
                transform: translateX(5px);
            }
        }

        .footer-menu {
            background-color: #000;
            padding: 10px;
            text-align: center;
            border-top: 2px solid #ff0000;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }

        .footer-menu p {
            margin: 3px 0;
            color: #aaa;
            font-size: 12px;
        }

        /* Estilos para el chat */
        #ConnectyCube_chat-widget {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 1000;
        }

        @media (min-width: 768px) {
            .menu-items a {
                font-size: 16px;
                margin: 0 15px;
            }
            .company-title h1 {
                font-size: 3em;
            }
            .welcome-box p {

    </style>
    
    <!-- Scripts para el chat en vivo -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/connectycube@4/dist/connectycube.min.js"></script>
    <script src="https://unpkg.com/@connectycube/chat-widget@latest/dist/index.umd.js"></script>
</head>
<body>
    <!-- Fondo animado con código binario -->
    <div class="binary-background" id="binaryBackground"></div>

    <div class="menu-horizontal">
        <div class="menu-items">
            <a href="index.html">Home</a>

    <div class="hero-section">
        <div class="company-title">
            <h1>PREMIUN BLAK LV</h1>
        </div>
        
        <div class="welcome-box">
            <p>✅<span class="highlight">ADMINISTRADOR☢️ NACIONAL📲 DE C/V👀 EN CUBA🇨🇺</span><br>

        <p>PREMIUN BLAK LV - Compra y venta de cuentas y recargas de saldo</p>
        <p>© 2023 Todos los derechos reservados</p>
    </div>

    <script>
        // Generador de código binario animado mejorado
        document.addEventListener('DOMContentLoaded', function() {
            const background = document.getElementById('binaryBackground');
            const characters = '01';
            const fontSize = 14;
            const density = window.innerWidth < 768 ? 0.8 : 1.2;
            
            function createBinary() {
                const columns = Math.floor(window.innerWidth / (fontSize * density));
                
                background.innerHTML = '';
                
                for (let i = 0; i < columns; i++) {
                    const binary = document.createElement('div');
                    binary.className = 'binary-code';
                    binary.style.left = (i * fontSize * density) + 'px';
                    binary.style.animationDuration = (8 + Math.random() * 15) + 's';
                    binary.style.animationDelay = (Math.random() * 3) + 's';
                    
                    let binaryText = '';
                    const length = 30 + Math.floor(Math.random() * 50);
                    for (let j = 0; j < length; j++) {
                        binaryText += characters.charAt(Math.floor(Math.random() * characters.length)) + ' ';
                    }
                    
                    binary.textContent = binaryText.trim();
                    background.appendChild(binary);
                }
            }
            
            createBinary();
            
            window.addEventListener('resize', function() {
                createBinary();
            });

            // Configuración del chat en vivo
            const chatWidgetContainer = document.createElement('div');
            chatWidgetContainer.id = 'ConnectyCube_chat-widget';
            document.body.appendChild(chatWidgetContainer);
            
            const props = {
                appId: 9187,
                authKey: '1137971C-90E6-4AA1-B587-34F799813576',
                userId: '45', // a User Id from your system
                userName: 'Samuel', // how other users will see your user name
                showOnlineUsersTab: false,
                splitView: true,
            };
            
            ReactDOM.createRoot(chatWidgetContainer).render(React.createElement(ConnectyCubeChatWidget, props));
        });
    </script>
</body>
</html>
